<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="nickTitle">Cyber Detective</title>
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/quiz.css">
</head>
<body data-root="../" data-page="nickname">
<div id="chrome"></div>
<main id="main">
<section class="case narrow page-in" data-tab="">
  <h1 style="font-size:clamp(1.8rem,6vw,2.6rem)" data-i18n="nickTitle"></h1>
  <p data-i18n="nickText"></p>
  <form id="nick-form" novalidate>
    <label for="nick" data-i18n="nickLabel"></label>
    <input type="text" id="nick" name="nickname" minlength="3" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="nick-hint nick-error" required>
    <p class="hint" id="nick-hint" data-i18n="nickHint"></p>
    <div class="error" id="nick-error" role="alert" hidden></div>
    <p style="margin-top:18px"><button type="submit" class="btn btn-primary" id="nick-btn" data-i18n="nickBtn"></button></p>
  </form>
</section>
</main>
<script type="module" src="../js/nickname.js"></script>
</body>
</html>
