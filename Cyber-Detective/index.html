<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="brand">Cyber Detective</title>
<meta name="description" content="Cyber Detective: an interactive cybersecurity awareness investigation. Think before you click.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body data-root="" data-page="landing">
<div id="chrome"></div>
<main id="main">
  <section class="hero page-in">
    <div>
      <h1 data-i18n="heroTitle">Think Before You Click.</h1>
      <p class="lead" data-i18n="heroText"></p>
      <div class="btn-row">
        <a class="btn btn-primary" href="pages/nickname.html" data-i18n="ctaStart"></a>
        <a class="btn btn-ghost" href="#how" data-i18n="ctaHow"></a>
      </div>
    </div>
    <div class="hero-art"><img src="assets/images/hero.svg" alt="" width="480" height="440"></div>
  </section>

  <section class="section mission" aria-labelledby="mission-h">
    <h2 id="mission-h" data-i18n="missionTitle"></h2>
    <p data-i18n="missionText"></p>
  </section>

  <section class="section" aria-labelledby="cases-h">
    <h2 id="cases-h" data-i18n="casesTitle"></h2>
    <p data-i18n="casesText"></p>
    <div class="stages">
      <article class="case stage-card" data-tab="1-5"><h3 data-i18n="stage1"></h3><p class="range">5 <span data-i18n="cases"></span></p><p data-i18n="stage1l"></p></article>
      <article class="case stage-card" data-tab="6-10"><h3 data-i18n="stage2"></h3><p class="range">5 <span data-i18n="cases"></span></p><p data-i18n="stage2l"></p></article>
      <article class="case stage-card" data-tab="11-15"><h3 data-i18n="stage3"></h3><p class="range">5 <span data-i18n="cases"></span></p><p data-i18n="stage3l"></p></article>
      <article class="case stage-card" data-tab="16-20"><h3 data-i18n="stage4"></h3><p class="range">5 <span data-i18n="cases"></span></p><p data-i18n="stage4l"></p></article>
    </div>
  </section>

  <section class="section" id="how" aria-labelledby="how-h">
    <h2 id="how-h" data-i18n="howTitle"></h2>
    <ol class="steps">
      <li><b data-i18n="how1t"></b><span data-i18n="how1"></span></li>
      <li><b data-i18n="how2t"></b><span data-i18n="how2"></span></li>
      <li><b data-i18n="how3t"></b><span data-i18n="how3"></span></li>
      <li><b data-i18n="how4t"></b><span data-i18n="how4"></span></li>
    </ol>
    <p style="margin-top:28px"><a class="btn btn-primary" href="pages/nickname.html" data-i18n="ctaStart"></a></p>
  </section>
</main>
<footer class="site-footer"><div class="in"><strong data-i18n="brand"></strong><p data-i18n="footer1"></p><p data-i18n="footer2"></p></div></footer>
<script type="module" src="js/landing.js"></script>
</body>
</html>
